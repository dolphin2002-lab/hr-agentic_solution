[project]
name = "hr-agentic-solution"
version = "1.4.0"
description = "Enterprise HR Agentic Solution (MVP 1) with Gemini 3.8 Flash, VAIS Policy Handbook RAG, and evaluation-plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[eval]>=0.5.0",
    "google-genai>=1.0.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-storage>=2.18.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

